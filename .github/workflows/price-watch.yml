name: Sailing price watch

on:
  schedule:
    # The checks are started by Sam's cron-job.org timer at minute 7 of 06, 09-17 and 22 UK time (Sam, 12 Oct 2026):
    # GitHub's own schedule never fired on 12 Oct. These UTC crons stay as a backstop; if they ever fire too,
    # the extra check finds nothing new.
    # Hourly 09:00–17:00 GMT (cron is UTC = GMT), nothing overnight (Sam, 12 Oct 2026).
    # In summer (BST) that is 10:00–18:00 UK time. Each check adds its changes to runs/<date>.json.
    # Runs at 7 minutes past: GitHub drops scheduled runs at busy times, worst on the hour
    # (the :00 runs at 12:00 and 13:00 on 12 Oct never started).
    - cron: "7 9-17 * * *"
    # Plus 22:07 and 06:07 GMT, so evening price changes reach the cards before the morning (Sam, 12 Oct 2026).
    - cron: "7 22,6 * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit state/, runs/
  issues: write     # open new-claim / failure issues
  actions: write    # start the daily competitor check (its own workflow)

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # the first card run makes every sailing's cards
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, so the pull before pushing can always rebase

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run price watch
        id: watch
        # Card rendering is paused (Sam, 12 Oct 2026): prices only. To turn it back on,
        # drop --no-cards and restore the Playwright install step (see git history).
        env:
          HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
        run: python daily.py --no-cards

      # France (Ambassador Croisières; Sam, 14 Oct 2026): ambassadorcroisieres.fr's cruise list, pages and booking
      # prices, kept in state/fr and runs/fr. Prices only, no was/now. Runs whatever happened to the UK check, and a
      # French problem never stops the UK prices being saved. See fr_enrich.py.
      - name: France prices
        id: fr
        if: always() && steps.watch.outcome != 'cancelled'
        continue-on-error: true
        env:
          HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
        run: python daily.py --market fr

      # Competitor prices and offers (Sam, 15 Oct 2026): every sailing Ambassador competes with, from Fred. Olsen's
      # own site and the agent Planet Cruise. Reading them all takes 30-50 minutes, so it's its own workflow
      # (competitors.yml); the first check of a UK day starts it, unless it has already run today or is running.
      - name: Start the competitor check
        if: always() && steps.watch.outcome != 'cancelled'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          done_today=$(python -c "import json,daily;from pathlib import Path;p=Path('state/competitors/current.json');print('yes' if p.exists() and json.loads(p.read_text()).get('updated')==daily.london_today() else '')")
          if [ -n "$done_today" ]; then echo "Competitor check already done today."; exit 0; fi
          busy=$(gh run list --workflow competitors.yml --limit 5 --json status,createdAt \
            --jq '[.[] | select(.status != "completed" or (.createdAt | fromdateiso8601) > (now - 10800))] | length')
          if [ "$busy" != "0" ]; then echo "A competitor check is running or ran in the last 3 hours."; exit 0; fi
          gh workflow run competitors.yml --ref "$GITHUB_REF_NAME"
          echo "Started the competitor check."

      # Competitor offers from their own newsletters (Sam, 15 Oct 2026): a team mailbox signed up to their marketing
      # emails, read read-only every check; skipped until the OFFERS_IMAP_* secrets exist. See offers_inbox.py.
      - name: Competitor newsletters
        id: inbox
        if: always() && steps.watch.outcome != 'cancelled'
        continue-on-error: true
        env:
          OFFERS_IMAP_USER: ${{ secrets.OFFERS_IMAP_USER }}
          OFFERS_IMAP_PASSWORD: ${{ secrets.OFFERS_IMAP_PASSWORD }}
          OFFERS_IMAP_HOST: ${{ vars.OFFERS_IMAP_HOST }}
        run: python offers_inbox.py fetch

      # Claude (on Sam's plan) turns each new newsletter into its offers; without it the simple rules' offers stay.
      # The repo variable OFFERS_CLAUDE = off turns this off.
      - name: Read new newsletters with Claude
        if: always() && steps.inbox.outputs.pending != '' && steps.inbox.outputs.pending != '0' && vars.OFFERS_CLAUDE != 'off'
        continue-on-error: true
        timeout-minutes: 20
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "No CLAUDE_CODE_OAUTH_TOKEN: the rules' offers are kept."; exit 0; fi
          export CLAUDE_CODE_OAUTH_TOKEN="$(printf %s "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          npm install -g @anthropic-ai/claude-code@2.1.296 --no-audit --no-fund
          python offers_inbox.py extract

      # Promotion T&Cs from the website's own pages (Sam, 13 Oct 2026): read once a day, matched to the
      # live promotions every check. See terms.py.
      - name: Promotion terms
        if: steps.watch.outcome == 'success'
        continue-on-error: true   # a terms problem must never stop prices or cards being saved
        run: python terms.py

      # French offer T&Cs (14 Oct 2026): the "Conditions de l'offre …" blocks on ambassadorcroisieres.fr's /offres pages,
      # matched to the French promotions. state/fr/terms.json. See terms.py.
      - name: French promotion terms
        if: always() && steps.fr.outcome == 'success'
        continue-on-error: true
        run: python terms.py --market fr

      # Standard cards for every sailing on sale (Sam, 12 Oct 2026; was/now cards stay paused):
      # only sailings whose card content changed are remade. See cards_sync.py.
      - name: Which cards need making
        id: cards
        if: steps.watch.outcome == 'success'
        continue-on-error: true   # a card problem must never stop prices being saved (QA, 13 Oct 2026)
        run: python cards_sync.py plan

      # French standard cards (Sam, 14 Oct 2026, France stage 2): same as the UK's, in French and euros, under
      # pricewatch-cards/fr in Storage and state/fr/cards.json. No was/now for France.
      - name: Which French cards need making
        id: frcards
        if: always() && steps.fr.outcome == 'success'
        continue-on-error: true
        run: python cards_sync.py plan --market fr

      - name: Install the card renderer
        if: always() && ((steps.cards.outputs.todo != '' && steps.cards.outputs.todo != '0') || (steps.frcards.outputs.todo != '' && steps.frcards.outputs.todo != '0'))
        continue-on-error: true
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Make and upload cards
        id: cardrun
        if: steps.cards.outputs.work != '' && steps.cards.outputs.work != '0'
        continue-on-error: true   # a card problem must never stop prices being saved
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
        run: |
          pip install google-auth==2.40.3 requests==2.32.3 pillow==11.3.0
          python cards_sync.py run

      - name: Make and upload French cards
        id: frcardrun
        if: always() && steps.frcards.outputs.work != '' && steps.frcards.outputs.work != '0'
        continue-on-error: true   # a card problem must never stop prices being saved
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          pip install google-auth==2.40.3 requests==2.32.3 pillow==11.3.0
          python cards_sync.py run --market fr

      # Claude Code looks over new or remade cards and lists any that need a person's eye (Sam, 12 Oct 2026).
      # Runs on Sam's Claude plan (CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token`), not a paid API key;
      # skipped until that secret is added. The first check of every card is split over 4 of the plan's
      # 5-hour usage windows. See card_review.py.
      - name: Check new cards
        id: review
        # On since 14 Oct 2026 (Sam; first pass from Sat 17 Oct, see card_review.py START). To pause it, add the repo
        # variable CARD_CHECK = off (Settings → Secrets and variables → Actions → Variables).
        # French cards (14 Oct 2026) queue after the UK's in the same batches; CARD_CHECK_FR = off leaves them out.
        if: always() && (steps.cards.outcome == 'success' || steps.frcards.outcome == 'success') && vars.CARD_CHECK != 'off'
        continue-on-error: true   # a check problem must never stop prices or cards being saved
        timeout-minutes: 30
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FR_OFF: ${{ vars.CARD_CHECK_FR }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "No CLAUDE_CODE_OAUTH_TOKEN secret: card check skipped."; exit 0; fi
          # A token copied out of a terminal often picks up line breaks or spaces: drop them.
          export CLAUDE_CODE_OAUTH_TOKEN="$(printf %s "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          npm install -g @anthropic-ai/claude-code@2.1.296
          pip install requests==2.32.3
          python card_review.py

      - name: Commit results
        # always(): prices are saved even if a later card step failed (QA, 13 Oct 2026); France's alone if the UK's failed
        if: always() && (steps.watch.outcome == 'success' || steps.fr.outcome == 'success')
        run: |
          git config user.name "price-watch-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # cards/ only exists on days with new claims; naming a missing path makes
          # `git add` stage nothing at all, so add it separately.
          git add state runs
          if [ -d cards ]; then git add cards; fi
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Price watch $(date -u '+%F %H:%M') UTC"
          # Pick up anything pushed since checkout (e.g. a merged PR) before pushing.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

      - name: Keep raw feed + snapshot for 30 days
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: price-watch-${{ github.run_id }}
          path: |
            data/
            out/
          retention-days: 30
          if-no-files-found: ignore

      - name: Open issue for new was/now claims
        if: steps.watch.outputs.new_claims == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # One issue per day; later checks that day with new claims add a comment.
        run: .github/issue.sh "New was/now claims — ${{ steps.watch.outputs.date }}" out/issue.md

      - name: Open issue for ad feed prices that don't match the website
        if: steps.watch.outputs.feed_gaps == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # One issue per day; later checks that find more add a comment (each sailing reported once).
        run: .github/issue.sh "Feed prices don't match the website — ${{ steps.watch.outputs.date }}" out/feed_gaps.md

      - name: Open issue for French pages that don't match booking
        if: steps.fr.outputs.feed_gaps == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/issue.sh "France: pages don't match booking — ${{ steps.fr.outputs.date }}" out/fr/feed_gaps.md

      - name: Open issue if the France check failed
        if: always() && steps.fr.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The France price check at $(date -u '+%H:%M') UTC failed or its safety check stopped it. The UK check isn't affected. Nothing French was saved unless the log says otherwise."
            echo
            echo "Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            [ -f out/fr/summary.md ] && cat out/fr/summary.md
          } > /tmp/frfail.md
          .github/issue.sh "France price watch FAILED — $(TZ=Europe/London date +%F)" /tmp/frfail.md

      - name: Open issue for ended was/now claims
        if: steps.cardrun.outputs.wasnow_ended != '' && steps.cardrun.outputs.wasnow_ended != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/issue.sh "Was/now cards withdrawn — $(TZ=Europe/London date +%F)" out/wasnow_ended.md

      - name: Open issue if cards failed
        if: steps.cardrun.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Prices were saved, but some cards couldn't be made or uploaded at $(date -u '+%H:%M') UTC. The next check tries again."
            echo
            echo "Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            [ -f out/summary.md ] && sed -n '/^## Cards/,$p' out/summary.md
          } > /tmp/cards.md
          .github/issue.sh "Cards FAILED — $(TZ=Europe/London date +%F)" /tmp/cards.md

      - name: Open issue if French cards failed
        if: always() && steps.frcardrun.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "French prices were saved, but some French cards couldn't be made or uploaded at $(date -u '+%H:%M') UTC. The next check tries again."
            echo
            echo "Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            [ -f out/fr/summary.md ] && sed -n '/^## France cards/,$p' out/fr/summary.md
          } > /tmp/frcards.md
          .github/issue.sh "France cards FAILED — $(TZ=Europe/London date +%F)" /tmp/frcards.md

      - name: Open issue for cards to check
        if: steps.review.outputs.flagged != '' && steps.review.outputs.flagged != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        # One issue per day; later checks that flag more cards add a comment.
        run: .github/issue.sh "Cards to check — $(TZ=Europe/London date +%F)" out/review.md

      - name: Open issue if the card check can't sign in
        if: steps.review.outputs.signin_failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/issue.sh "Card check can't sign in — $(TZ=Europe/London date +%F)" out/review_signin.md

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The price watch check at $(date -u '+%H:%M') UTC failed or its safety check stopped it. Nothing was saved unless the log says otherwise."
            echo
            echo "Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            [ -f out/summary.md ] && cat out/summary.md
          } > /tmp/fail.md
          # One issue per day; later failures that day add a comment.
          .github/issue.sh "Price watch FAILED — $(TZ=Europe/London date +%F)" /tmp/fail.md

  publish:
    needs: watch
    uses: ./.github/workflows/publish.yml
    secrets: inherit
