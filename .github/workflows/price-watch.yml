name: Sailing price watch

on:
  schedule:
    # Hourly 09:00–17:00 GMT (cron is UTC = GMT), nothing overnight (Sam, 12 Oct 2026).
    # In summer (BST) that is 10:00–18:00 UK time. Each check adds its changes to runs/<date>.json.
    # Runs at 7 minutes past: GitHub drops scheduled runs at busy times, worst on the hour
    # (the :00 runs at 12:00 and 13:00 on 12 Oct never started).
    - cron: "7 9-17 * * *"
    # Plus 22:07 and 06:07 GMT, so evening price changes reach the cards before the morning (Sam, 12 Oct 2026).
    - cron: "7 22,6 * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit state/, runs/
  issues: write     # open new-claim / failure issues

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # the first card run makes every sailing's cards
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, so the pull before pushing can always rebase

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run price watch
        id: watch
        # Card rendering is paused (Sam, 12 Oct 2026): prices only. To turn it back on,
        # drop --no-cards and restore the Playwright install step (see git history).
        run: python daily.py --no-cards

      # Standard cards for every sailing on sale (Sam, 12 Oct 2026; was/now cards stay paused):
      # only sailings whose card content changed are remade. See cards_sync.py.
      - name: Which cards need making
        id: cards
        if: steps.watch.outcome == 'success'
        run: python cards_sync.py plan

      - name: Install the card renderer
        if: steps.cards.outputs.todo != '' && steps.cards.outputs.todo != '0'
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Make and upload cards
        id: cardrun
        if: steps.cards.outputs.work != '' && steps.cards.outputs.work != '0'
        continue-on-error: true   # a card problem must never stop prices being saved
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
        run: |
          pip install google-auth==2.40.3 requests==2.32.3 pillow==11.3.0
          python cards_sync.py run

      # Claude Code looks over new or remade cards and lists any that need a person's eye (Sam, 12 Oct 2026).
      # Runs on Sam's Claude plan (CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token`), not a paid API key;
      # skipped until that secret is added. The first check of every card is split over 4 of the plan's
      # 5-hour usage windows. See card_review.py.
      - name: Check new cards
        id: review
        if: always() && steps.cards.outcome == 'success'
        continue-on-error: true   # a check problem must never stop prices or cards being saved
        timeout-minutes: 30
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "No CLAUDE_CODE_OAUTH_TOKEN secret: card check skipped."; exit 0; fi
          npm install -g @anthropic-ai/claude-code@2.1.296
          pip install requests==2.32.3
          python card_review.py

      - name: Commit results
        if: steps.watch.outcome == 'success'
        run: |
          git config user.name "price-watch-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # cards/ only exists on days with new claims; naming a missing path makes
          # `git add` stage nothing at all, so add it separately.
          git add state runs
          if [ -d cards ]; then git add cards; fi
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Price watch $(date -u '+%F %H:%M') UTC"
          # Pick up anything pushed since checkout (e.g. a merged PR) before pushing.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

      - name: Keep raw feed + snapshot for 30 days
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: price-watch-${{ github.run_id }}
          path: |
            data/
            out/
          retention-days: 30
          if-no-files-found: ignore

      - name: Open issue for new was/now claims
        if: steps.watch.outputs.new_claims == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # One issue per day; later checks that day with new claims add a comment.
        run: .github/issue.sh "New was/now claims — ${{ steps.watch.outputs.date }}" out/issue.md

      - name: Open issue for ended was/now claims
        if: steps.cardrun.outputs.wasnow_ended != '' && steps.cardrun.outputs.wasnow_ended != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/issue.sh "Was/now cards withdrawn — $(TZ=Europe/London date +%F)" out/wasnow_ended.md

      - name: Open issue if cards failed
        if: steps.cardrun.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Prices were saved, but some cards couldn't be made or uploaded at $(date -u '+%H:%M') UTC. The next check tries again."
            echo
            echo "Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            [ -f out/summary.md ] && sed -n '/^## Cards/,$p' out/summary.md
          } > /tmp/cards.md
          .github/issue.sh "Cards FAILED — $(TZ=Europe/London date +%F)" /tmp/cards.md

      - name: Open issue for cards to check
        if: steps.review.outputs.flagged != '' && steps.review.outputs.flagged != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        # One issue per day; later checks that flag more cards add a comment.
        run: .github/issue.sh "Cards to check — $(TZ=Europe/London date +%F)" out/review.md

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The price watch check at $(date -u '+%H:%M') UTC failed or its safety check stopped it. Nothing was saved unless the log says otherwise."
            echo
            echo "Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            [ -f out/summary.md ] && cat out/summary.md
          } > /tmp/fail.md
          # One issue per day; later failures that day add a comment.
          .github/issue.sh "Price watch FAILED — $(TZ=Europe/London date +%F)" /tmp/fail.md

  publish:
    needs: watch
    uses: ./.github/workflows/publish.yml
    secrets: inherit
