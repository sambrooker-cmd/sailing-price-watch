name: Video function

# Deploys the Firebase functions behind the tracker page's Make video button and the Email creator's images (functions/index.js), when it
# changes on main or when run by hand. Needs (one-off, see CLAUDE.md "Make video from the tracker page"):
#   - the promotions-planner project on the Blaze plan,
#   - the roles listed there on the FIREBASE_SERVICE_ACCOUNT service account,
#   - repo secret VIDEO_DISPATCH_TOKEN: a fine-grained GitHub token, this repo only, Actions: read and write.
# Until VIDEO_DISPATCH_TOKEN exists this does nothing and the button keeps using the GitHub page.
on:
  push:
    branches: [main]
    paths: ["functions/**", ".github/workflows/video-function.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-function
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check the setup
        id: ready
        env:
          TOKEN: ${{ secrets.VIDEO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "VIDEO_DISPATCH_TOKEN isn't set yet, so the function isn't deployed." >> "$GITHUB_STEP_SUMMARY"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.ready.outputs.go == 'true'
        with:
          node-version: "22"

      - name: Install
        if: steps.ready.outputs.go == 'true'
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Deploy the function
        if: steps.ready.outputs.go == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TOKEN: ${{ secrets.VIDEO_DISPATCH_TOKEN }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          printf '{"functions":[{"source":"functions","codebase":"default"}]}\n' > firebase.json
          FB="npx --yes firebase-tools@15.31.0 --project promotions-planner --non-interactive"
          # The GitHub token goes into Secret Manager (never into the code or the logs); old versions are pruned
          printf '%s' "$TOKEN" | tr -d '\r\n ' > "$RUNNER_TEMP/tok"
          $FB functions:secrets:set GITHUB_VIDEO_TOKEN --data-file "$RUNNER_TEMP/tok" --force
          rm -f "$RUNNER_TEMP/tok"
          $FB deploy --only functions:makeVideo,functions:emailImages,functions:saved --force
          $FB functions:secrets:prune --force || true
          echo "Deployed: https://us-central1-promotions-planner.cloudfunctions.net/makeVideo" >> "$GITHUB_STEP_SUMMARY"
