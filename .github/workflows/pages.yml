name: Publish tracker page

on:
  # The daily price watch calls this after it commits (its own push can't
  # trigger workflows). This trigger covers manual edits to the page or data.
  push:
    branches: [main]
    paths: [site/**, state/**, runs/**, build_site.py]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Branch tip, so a call from the price watch includes the commit it just pushed.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build page
        run: python build_site.py _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
