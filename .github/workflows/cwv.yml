name: Core Web Vitals

# Our pages' speed and real visitors' Core Web Vitals for us and the competitors (Sam, 17 Oct 2026), once a day, with
# Google's free PageSpeed Insights and Chrome UX Report APIs (repo secret PAGESPEED_API_KEY). Started by the hourly
# price watch's first check of a UK day (step "Start the Core Web Vitals check"); a backstop timer and a manual run too.
# Commits state/seo/cwv.json, opens a "Core Web Vitals got worse" issue when one of our phone figures drops a rating,
# then publishes. Read-only: changes nothing on any website. See seo_cwv.py.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if today's check has been done"
        type: boolean
        default: false
  schedule:
    - cron: "23 8 * * *"   # backstop only

permissions:
  contents: write
  issues: write

concurrency:
  group: cwv
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read Core Web Vitals
        id: cwv
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: python seo_cwv.py ${{ inputs.force && '--force' || '' }}

      - name: Commit results
        if: always() && steps.cwv.outcome == 'success'
        run: |
          git config user.name "price-watch-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seo/cwv.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Core Web Vitals $(date -u '+%F %H:%M') UTC"
          for i in 1 2 3 4; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
            sleep $((i * 10))
          done
          exit 1

      - name: Open issue if our Core Web Vitals got worse
        if: steps.cwv.outcome == 'success' && hashFiles('out/cwv_alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/issue.sh "Core Web Vitals got worse — $(TZ=Europe/London date +%F)" out/cwv_alert.md

      - name: Open issue if the check failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The daily Core Web Vitals check failed at $(date -u '+%H:%M') UTC. Prices are unaffected; tomorrow's check tries again (or run Actions → Core Web Vitals by hand)."
            echo
            echo "Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/cwv.md
          .github/issue.sh "Core Web Vitals check FAILED — $(TZ=Europe/London date +%F)" /tmp/cwv.md

  publish:
    needs: check
    if: needs.check.result == 'success'
    uses: ./.github/workflows/publish.yml
    secrets: inherit
