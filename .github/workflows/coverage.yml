name: Feed coverage check

# Weekly: sailings on sale on the website but missing from the ad feed.
# Saves state/coverage.json (shown on the tracker page) and opens an issue
# only when a sailing goes missing that the previous check didn't flag.
on:
  schedule:
    - cron: "30 9 * * 1"   # Mondays 09:30 GMT (cron is UTC = GMT)
  workflow_dispatch:

permissions:
  contents: write   # commit state/coverage.json
  issues: write     # open an issue for newly missing sailings

concurrency:
  group: price-watch   # shares the hourly check's queue, so their commits never race
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # A browser, only to open the few sailings found missing from the feed (pages that send visitors to 404)
      - name: Install a browser
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Compare the website with the feed
        id: cov
        run: python coverage.py

      # France has no ad feed (14 Oct 2026): its cruise list against its sitemap instead. See coverage.py.
      - name: France cruise list vs sitemap
        id: frcov
        if: always()
        continue-on-error: true
        run: python coverage.py --market fr

      - name: Commit results
        if: always()
        run: |
          git config user.name "price-watch-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/coverage.json
          if [ -f state/fr/coverage.json ]; then git add state/fr/coverage.json; fi
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Feed coverage check $(date -u +%F)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

      - name: Open issue for newly missing sailings
        if: steps.cov.outputs.new_missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/issue.sh "Sailings on sale but not in the ad feed — ${{ steps.cov.outputs.date }}" out/coverage.md

      - name: Open issue for French sailings missing from the sitemap or cruise list
        if: always() && steps.frcov.outputs.new_missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/issue.sh "France: sailings missing from the sitemap or cruise list — ${{ steps.frcov.outputs.date }}" out/fr/coverage.md

      - name: Open issue if the France check failed
        if: always() && steps.frcov.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The weekly France coverage check (cruise list vs sitemap) failed. The UK check is separate."
            echo
            echo "Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            [ -f out/fr/coverage.md ] && cat out/fr/coverage.md
          } > /tmp/frfail.md
          .github/issue.sh "France coverage check FAILED — $(date -u +%F)" /tmp/frfail.md

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The weekly feed coverage check failed. Nothing was saved unless the log says otherwise."
            echo
            echo "Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            [ -f out/coverage.md ] && cat out/coverage.md
          } > /tmp/fail.md
          .github/issue.sh "Feed coverage check FAILED — $(date -u +%F)" /tmp/fail.md

  publish:
    needs: check
    if: always()
    uses: ./.github/workflows/publish.yml
    secrets: inherit
