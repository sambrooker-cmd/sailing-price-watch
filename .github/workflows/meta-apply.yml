name: "Meta ads: apply"

# Applies one approved change to our Meta ad account (Sam, 17 Oct 2026). Started by the Firebase function
# `metaAction` (functions/index.js) when an approver presses Approve, or makes a change by hand, on the tracker's
# Meta ads page. meta_manage.py reads the request, reads the account again, and only then acts: a proposal is worked
# out afresh and applied only if it is still the same; hand changes are checked (budgets at most double or halve in
# one go, a daily budget never above META_MAX_DAILY_BUDGET). The Meta token lives only in the repo secret
# META_ADS_TOKEN. The outcome is written on the request, where the page shows it.
on:
  workflow_dispatch:
    inputs:
      request:
        description: "Filled in by the tracker page (don't run this by hand)"
        required: true

run-name: "Meta ads: apply (${{ inputs.request }})"

permissions:
  contents: write   # commits state/meta/published.json (the ads the tracker made) after publishing or remaking

concurrency:
  group: meta-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install playwright==1.56.0 pillow==11.3.0 google-auth==2.40.3 requests==2.32.3
          python -m playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Apply the change
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ vars.META_AD_ACCOUNT_ID }}
          META_API_VERSION: ${{ vars.META_API_VERSION }}
          META_MAX_DAILY_BUDGET: ${{ vars.META_MAX_DAILY_BUDGET }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID }}
          META_INSTAGRAM_ID: ${{ vars.META_INSTAGRAM_ID }}
          REQUEST: ${{ inputs.request }}
        run: python meta_manage.py apply "$REQUEST"

      - name: Mark the request as failed
        if: failure() || cancelled()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          REQUEST: ${{ inputs.request }}
        run: python meta_manage.py failed "$REQUEST"

      - name: Save the ads the tracker made
        if: always() && hashFiles('state/meta/published.json') != ''
        run: |
          git config user.name "price-watch-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/meta/published.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Meta ads made by the tracker $(date -u '+%F %H:%M') UTC"
          for i in 1 2 3 4; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
