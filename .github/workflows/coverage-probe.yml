name: Coverage probe (temporary)

# One-off investigation: which sailings are on the website but not in the ad
# feed. Saves nothing. Delete once done.
on:
  push:
    branches: [claude/new-session-i0hsfd]
    paths: [.github/workflows/coverage-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compare website sailings with the feed
        run: |
          python - <<'PY'
          import csv, io, re, datetime, collections, concurrent.futures as cf
          import enrich
          SITE = "https://www.ambassadorcruiseline.com"
          feed = list(csv.DictReader(io.StringIO(enrich.get(enrich.FEED))))
          feed_ids = {r["id"].upper() for r in feed}
          feed_links = {r["link"].rstrip("/").lower() for r in feed}
          print(f"Feed: {len(feed)} sailings")

          robots = ""
          try:
              robots = enrich.get(SITE + "/robots.txt")
          except Exception as e:
              print("robots.txt:", e)
          maps = re.findall(r"(?im)^sitemap:\s*(\S+)", robots) or [SITE + "/sitemap.xml", SITE + "/sitemap-index.xml"]
          print("Sitemaps to read:", maps)
          seen, urls = set(), set()
          todo = list(maps)
          while todo:
              m = todo.pop()
              if m in seen: continue
              seen.add(m)
              try:
                  x = enrich.get(m)
              except Exception as e:
                  print("  could not read", m, "-", str(e)[:80]); continue
              locs = re.findall(r"<loc>\s*([^<\s]+)\s*</loc>", x)
              subs = [l for l in locs if l.endswith(".xml")]
              todo += subs
              urls |= {l for l in locs if not l.endswith(".xml")}
              print(f"  {m}: {len(locs)} entries ({len(subs)} sub-sitemaps)")
          cruise = sorted({u.rstrip("/") for u in urls if "/cruise/" in u})
          print(f"Cruise pages in sitemap: {len(cruise)}")
          code = lambda u: u.rsplit("/cruise/", 1)[1].split("-", 1)[0].upper()
          site_ids = {code(u): u for u in cruise}
          missing = {c: u for c, u in site_ids.items() if c not in feed_ids and u.lower() not in feed_links}
          not_on_site = sorted(feed_ids - set(site_ids))
          print(f"In the feed but not in the sitemap: {len(not_on_site)} {not_on_site[:30]}")
          print(f"On the site but not in the feed: {len(missing)}")

          today = datetime.date.today().isoformat()
          def check(item):
              c, u = item
              f = enrich.page_fields(u + "/")
              tw = (f.get("cabins") or {}).get("twin") or {}
              solo = (f.get("cabins") or {}).get("solo") or {}
              dep = f.get("departure_date")
              if "page_error" in f: status = "page error: " + f["page_error"][:60]
              elif dep and dep < today: status = "departed"
              elif tw: status = "on sale"
              elif solo: status = "on sale (solo only)"
              elif "cabins" in f: status = "no cabins on sale (sold out?)"
              else: status = "no prices on page"
              return c, u, dep, status, (min(tw.values()) if tw else None), [o["name"] for o in (f.get("offers") or [])]
          with cf.ThreadPoolExecutor(8) as ex:
              res = list(ex.map(check, sorted(missing.items())))
          by = collections.Counter(r[3].split(":")[0] for r in res)
          print("\nSTATUS OF SAILINGS ON THE SITE BUT NOT IN THE FEED:", dict(by))
          for c, u, dep, st, p, offers in sorted(res, key=lambda r: (r[3], r[2] or "")):
              print(f"  {c:12} {dep or '-':10}  {st:28} {('£%d' % p) if p else '':7} {u.rsplit('/', 1)[1][:70]}  {'; '.join(offers)}")
          PY
