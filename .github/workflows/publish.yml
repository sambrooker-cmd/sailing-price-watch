name: Publish tracker page

on:
  # The daily price watch calls this after it commits (its own push can't
  # trigger workflows). This trigger covers manual edits to the page or data.
  push:
    branches: [main]
    paths: [site/**, state/**, runs/**, publish.py, .github/workflows/publish.yml]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT: promotions-planner
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
    steps:
      - name: Check settings
        run: |
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || { echo "::error::Add the FIREBASE_SERVICE_ACCOUNT secret (see CLAUDE.md, Tracker page)"; exit 1; }
          [ -n "$HOSTING_SITE" ] || { echo "::error::Add the FIREBASE_HOSTING_SITE variable (see CLAUDE.md, Tracker page)"; exit 1; }

      - uses: actions/checkout@v7
        with:
          # Branch tip, so a call from the price watch includes the commit it just pushed.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Copy prices to Firestore
        run: |
          pip install google-auth==2.40.3 requests==2.32.3
          python publish.py

      # Lets the page's "Download these" zip card images in the browser (adds one CORS rule
      # for this site to the Storage bucket, keeping any others). No-op once it's in place.
      - name: Allow card downloads from the page
        continue-on-error: true
        run: python storage_cors.py

      - name: Deploy page to Firebase Hosting
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          # Page, scripts and data files: browsers check for a newer copy every time (a quick "not changed"
          # when nothing has), so a merged change shows on the next reload instead of up to an hour later.
          printf '{"hosting":{"site":"%s","public":"site","headers":[{"source":"/","headers":[{"key":"Cache-Control","value":"no-cache"}]},{"source":"**/*.@(html|js|json)","headers":[{"key":"Cache-Control","value":"no-cache"}]}]}}\n' "$HOSTING_SITE" > firebase.json
          python -c "import json; json.load(open('firebase.json'))"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            npx --yes firebase-tools@15.31.0 deploy --only hosting --project "$FIREBASE_PROJECT" --non-interactive
